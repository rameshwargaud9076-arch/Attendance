```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attendance Manager</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            color: #1d2939;
        }

        header {
            background: linear-gradient(135deg, #0f4c81, #1677c8);
            color: white;
            padding: 22px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 7px 0 0;
            opacity: .9;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 22px;
        }

        .add-company {
            display: flex;
            gap: 10px;
            background: white;
            padding: 16px;
            border-radius: 14px;
            box-shadow: 0 4px 15px #00000010;
            margin-bottom: 20px;
        }

        input,
        select,
        button {
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            padding: 12px;
            font-size: 15px;
        }

        input {
            flex: 1;
        }

        button {
            cursor: pointer;
            border: none;
            background: #1677c8;
            color: white;
            font-weight: bold;
        }

        button:hover {
            opacity: .9;
        }

        .company-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }

        .company-card {
            background: white;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 4px 15px #00000010;
            cursor: pointer;
            position: relative;
            transition: .2s;
        }

        .company-card:hover {
            transform: translateY(-4px);
        }

        .company-card h3 {
            margin: 0 0 8px;
            color: #0f4c81;
        }

        .delete-company {
            position: absolute;
            right: 12px;
            top: 12px;
            background: #e53935;
            padding: 6px 9px;
            font-size: 12px;
        }

        .hidden {
            display: none;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
            gap: 12px;
            margin-bottom: 18px;
        }

        .summary-box {
            background: white;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 15px #00000010;
        }

        .summary-box small {
            color: #667085;
            display: block;
        }

        .summary-box strong {
            font-size: 24px;
            display: block;
            margin-top: 6px;
        }

        .calendar {
            background: white;
            padding: 18px;
            border-radius: 14px;
            box-shadow: 0 4px 15px #00000010;
        }

        .weekdays,
        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .weekdays div {
            text-align: center;
            font-weight: bold;
            color: #667085;
            padding: 8px 0;
        }

        .day {
            min-height: 105px;
            border: 1px solid #e4e7ec;
            border-radius: 10px;
            padding: 8px;
            cursor: pointer;
            background: #fff;
        }

        .day:hover {
            border-color: #1677c8;
            background: #f0f8ff;
        }

        .empty {
            background: #f7f7f7;
            cursor: default;
            border: none;
        }

        .date-number {
            font-weight: bold;
        }

        .status {
            margin-top: 7px;
            padding: 5px 7px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
        }

        .present {
            background: #d1fadf;
            color: #067647;
        }

        .absent {
            background: #fee4e2;
            color: #b42318;
        }

        .weekoff {
            background: #e0eaff;
            color: #175cd3;
        }

        .overtime {
            background: #fff0c7;
            color: #a15c00;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: #00000088;
            align-items: center;
            justify-content: center;
            padding: 15px;
            z-index: 5;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 410px;
            padding: 22px;
            border-radius: 14px;
        }

        .modal-content h3 {
            margin-top: 0;
        }

        .status-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .status-buttons button {
            padding: 14px;
        }

        .btn-present {
            background: #12b76a;
        }

        .btn-absent {
            background: #f04438;
        }

        .btn-weekoff {
            background: #2e90fa;
        }

        .btn-overtime {
            background: #f79009;
        }

        .overtime-input {
            margin-top: 14px;
            display: none;
        }

        .overtime-input input {
            width: 100%;
            margin-top: 7px;
        }

        .save-btn {
            width: 100%;
            margin-top: 14px;
            background: #0f4c81;
        }

        .remove-btn {
            width: 100%;
            margin-top: 10px;
            background: #e53935;
        }

        .close-btn {
            background: #667085;
            width: 100%;
            margin-top: 10px;
        }

        .no-company {
            text-align: center;
            color: #667085;
            padding: 35px;
        }

        @media (max-width: 600px) {
            .day {
                min-height: 78px;
                font-size: 12px;
            }

            .status {
                font-size: 10px;
                padding: 4px;
            }

            .weekdays div {
                font-size: 12px;
            }

            .add-company {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Attendance Manager</h1>
        <p>Company-wise monthly attendance record</p>
    </header>

    <div class="container">
        <div id="homePage">
            <div class="add-company">
                <input type="text" id="companyName" placeholder="Enter Your Company Name" />
                <button onclick="addCompany()">Create Company Folder</button>
            </div>
            <div id="companyList" class="company-grid"></div>
        </div>

        <div id="attendancePage" class="hidden">
            <div class="top-bar">
                <div>
                    <button onclick="goHome()">← Back</button>
                    <h2 id="selectedCompanyName" style="display:inline-block; margin-left:12px;"></h2>
                </div>
                <div class="controls">
                    <select id="yearSelect" onchange="renderCalendar()"></select>
                    <select id="monthSelect" onchange="renderCalendar()"></select>
                </div>
            </div>

            <div class="summary">
                <div class="summary-box"><small>Present Days</small><strong id="presentCount">0</strong></div>
                <div class="summary-box"><small>Absent Days</small><strong id="absentCount">0</strong></div>
                <div class="summary-box"><small>Week Off</small><strong id="weekoffCount">0</strong></div>
                <div class="summary-box"><small>Overtime Days</small><strong id="overtimeCount">0</strong></div>
                <div class="summary-box"><small>Total OT Hours</small><strong id="overtimeHours">0</strong></div>
                <div class="summary-box"><small>Attendance %</small><strong id="attendancePercent">0%</strong></div>
            </div>

            <div class="calendar">
                <div class="weekdays">
                    <div>Sun</div>
                    <div>Mon</div>
                    <div>Tue</div>
                    <div>Wed</div>
                    <div>Thu</div>
                    <div>Fri</div>
                    <div>Sat</div>
                </div>
                <div id="calendarDays" class="days"></div>
            </div>
        </div>
    </div>

    <div id="statusModal" class="modal">
        <div class="modal-content">
            <h3 id="modalDateText">Select Attendance</h3>

            <div class="status-buttons">
                <button class="btn-present" onclick="chooseAttendance('Present')">Present</button>
                <button class="btn-absent" onclick="chooseAttendance('Absent')">Absent</button>
                <button class="btn-weekoff" onclick="chooseAttendance('Week Off')">Week Off</button>
                <button class="btn-overtime" onclick="toggleOvertime()">Overtime</button>
            </div>

            <div class="overtime-input" id="overtimeInputBox">
                <label><b>Overtime Hours:</b></label>
                <input type="number" id="otHoursInput" min="0.5" step="0.5" placeholder="Example: 2.5 hours" />
            </div>

            <button class="save-btn" onclick="saveAttendance()">Save Attendance</button>
            <button class="remove-btn" onclick="removeAttendance()">Remove Attendance</button>
            <button class="close-btn" onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <script>
        let selectedCompany = "";
        let selectedDateKey = "";
        let selectedAttendance = "";
        let overtimeSelected = false;

        const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

        function getData() {
            return JSON.parse(localStorage.getItem("attendanceData") || "{}");
        }

        function saveData(data) {
            localStorage.setItem("attendanceData", JSON.stringify(data));
        }

        function loadCompanies() {
            const data = getData();
            const companyList = document.getElementById("companyList");
            companyList.innerHTML = "";
            const companies = Object.keys(data);

            if (!companies.length) {
                companyList.innerHTML = `<div class="no-company">No company folder created yet.</div>`;
                return;
            }

            companies.forEach(company => {
                const card = document.createElement("div");
                card.className = "company-card";
                card.onclick = () => openCompany(company);
                card.innerHTML = `
        <button class="delete-company" onclick="deleteCompany(event, '${company.replace(/'/g, "\\'")}')">Delete</button>
        <h3>📁 ${company}</h3>
        <p>Click to open attendance folder</p>
      `;
                companyList.appendChild(card);
            });
        }

        function addCompany() {
            const input = document.getElementById("companyName");
            const name = input.value.trim();
            if (!name) return alert("Please enter company name.");

            const data = getData();
            if (data[name]) return alert("This company folder already exists.");

            data[name] = {};
            saveData(data);
            input.value = "";
            loadCompanies();
        }

        function deleteCompany(event, company) {
            event.stopPropagation();
            if (!confirm(`Delete ${company} and all attendance records?`)) return;
            const data = getData();
            delete data[company];
            saveData(data);
            loadCompanies();
        }

        function setupYearMonth() {
            const yearSelect = document.getElementById("yearSelect");
            const monthSelect = document.getElementById("monthSelect");
            const currentYear = new Date().getFullYear();

            yearSelect.innerHTML = "";
            for (let y = currentYear - 5; y <= currentYear + 5; y++) {
                yearSelect.innerHTML += `<option value="${y}">${y}</option>`;
            }

            monthSelect.innerHTML = "";
            months.forEach((m, i) => monthSelect.innerHTML += `<option value="${i}">${m}</option>`);

            yearSelect.value = currentYear;
            monthSelect.value = new Date().getMonth();
        }

        function openCompany(company) {
            selectedCompany = company;
            document.getElementById("homePage").classList.add("hidden");
            document.getElementById("attendancePage").classList.remove("hidden");
            document.getElementById("selectedCompanyName").textContent = "📁 " + company;
            setupYearMonth();
            renderCalendar();
        }

        function goHome() {
            document.getElementById("attendancePage").classList.add("hidden");
            document.getElementById("homePage").classList.remove("hidden");
            loadCompanies();
        }

        function renderCalendar() {
            const year = Number(document.getElementById("yearSelect").value);
            const month = Number(document.getElementById("monthSelect").value);
            const firstDay = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();
            const calendar = document.getElementById("calendarDays");
            const data = getData();
            calendar.innerHTML = "";

            for (let i = 0; i < firstDay; i++) calendar.innerHTML += `<div class="day empty"></div>`;

            for (let day = 1; day <= totalDays; day++) {
                const key = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
                const record = data[selectedCompany]?.[key] || {};
                let html = `<div class="day" onclick="openStatusModal('${key}')"><div class="date-number">${day}</div>`;

                if (record.attendance === "Present") html += `<div class="status present">Present</div>`;
                if (record.attendance === "Absent") html += `<div class="status absent">Absent</div>`;
                if (record.attendance === "Week Off") html += `<div class="status weekoff">Week Off</div>`;
                if (record.overtimeHours > 0) html += `<div class="status overtime">OT: ${record.overtimeHours} Hr</div>`;

                html += `</div>`;
                calendar.innerHTML += html;
            }
            updateSummary(year, month);
        }

        function openStatusModal(dateKey) {
            selectedDateKey = dateKey;
            const data = getData();
            const record = data[selectedCompany]?.[dateKey] || {};

            selectedAttendance = record.attendance || "";
            overtimeSelected = Number(record.overtimeHours) > 0;

            document.getElementById("modalDateText").textContent = "Attendance: " + dateKey;
            document.getElementById("otHoursInput").value = record.overtimeHours || "";
            document.getElementById("overtimeInputBox").style.display = overtimeSelected ? "block" : "none";
            document.getElementById("statusModal").style.display = "flex";
        }

        function chooseAttendance(status) {
            selectedAttendance = status;
        }

        function toggleOvertime() {
            overtimeSelected = !overtimeSelected;
            document.getElementById("overtimeInputBox").style.display = overtimeSelected ? "block" : "none";
            if (!overtimeSelected) document.getElementById("otHoursInput").value = "";
        }

        function saveAttendance() {
            if (!selectedAttendance && !overtimeSelected) {
                return alert("Please select Present, Absent, Week Off, or Overtime.");
            }

            let hours = 0;
            if (overtimeSelected) {
                hours = Number(document.getElementById("otHoursInput").value);
                if (!hours || hours <= 0) return alert("Please enter overtime hours.");
            }

            const data = getData();
            if (!data[selectedCompany]) data[selectedCompany] = {};

            data[selectedCompany][selectedDateKey] = {
                attendance: selectedAttendance,
                overtimeHours: hours
            };

            saveData(data);
            closeModal();
            renderCalendar();
        }

        function removeAttendance() {
            const data = getData();
            if (data[selectedCompany] && data[selectedCompany][selectedDateKey]) {
                delete data[selectedCompany][selectedDateKey];
                saveData(data);
            }
            closeModal();
            renderCalendar();
        }

        function closeModal() {
            document.getElementById("statusModal").style.display = "none";
        }

        function updateSummary(year, month) {
            const data = getData();
            const records = data[selectedCompany] || {};
            const prefix = `${year}-${String(month + 1).padStart(2, "0")}-`;

            let present = 0, absent = 0, weekoff = 0, overtimeDays = 0, totalHours = 0;

            Object.keys(records).forEach(key => {
                if (!key.startsWith(prefix)) return;
                const record = records[key];

                if (record.attendance === "Present") present++;
                if (record.attendance === "Absent") absent++;
                if (record.attendance === "Week Off") weekoff++;

                if (Number(record.overtimeHours) > 0) {
                    overtimeDays++;
                    totalHours += Number(record.overtimeHours);
                }
            });

            const workingDays = present + absent;
            const percentage = workingDays > 0 ? ((present / workingDays) * 100).toFixed(1) : 0;

            document.getElementById("presentCount").textContent = present;
            document.getElementById("absentCount").textContent = absent;
            document.getElementById("weekoffCount").textContent = weekoff;
            document.getElementById("overtimeCount").textContent = overtimeDays;
            document.getElementById("overtimeHours").textContent = totalHours + " Hr";
            document.getElementById("attendancePercent").textContent = percentage + "%";
        }

        loadCompanies();
    </script>
</body>

</html>
